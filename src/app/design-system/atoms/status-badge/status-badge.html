<div
  class="status-badge"
  [class.status-badge--planned]="status() === 'planned'"
  [class.status-badge--completed]="status() === 'completed'"
  [class.status-badge--cancelled]="status() === 'cancelled'"
  [class.status-badge--legend]="variant() === 'legend'"
  [class.status-badge--pill]="variant() === 'pill'"
>
  <div class="status-badge__label">
    {{ label() }}
  </div>
</div>
